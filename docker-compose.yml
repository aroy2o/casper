version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: casper-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: casper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: casper-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.development
    depends_on:
      - mongo
      - redis
      - ml-service
    ports:
      - "4000:4000"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: casper-ml
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: casper-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
